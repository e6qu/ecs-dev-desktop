# SPDX-License-Identifier: AGPL-3.0-or-later
# Tier-2 integration harness (see TESTING.md). Brings up the local substrate the
# integration tests run against; `pnpm test:integ` targets it by endpoint only
# (AGENTS.md §6.8).
#
# `sockerless-aws` is the published sockerless-cloud simulator image, pinned by
# digest to the same release the shared dev environment runs (e6qu/infra
# scaleway/simulator-images.json); scripts/check-sim-pins.sh keeps every tier
# on one digest. It runs with SIM_RUNTIME=process so the AWS API surface
# (EC2/EBS lifecycle, DynamoDB, etc.) serves without a container runtime.
#
# DynamoDB is served BY THE SIM in this tier (the integ run sets AWS_ENDPOINT_URL to
# the sim at :4566); the standalone DynamoDB-Local container was retired here once the
# sim's DynamoDB became conformant (sockerless #641/#642/#643/#644/#648 + the CloudTrail
# #650/#651 fixes). The container-mode e2e tier (docker-compose.e2e.yml) still uses
# DynamoDB Local — migrating it is a separate follow-up.

services:
  sockerless-aws:
    image: ghcr.io/e6qu/sockerless-simulator-aws@sha256:407b230954ae528313ed1f9c089636c74cfc61c889b416845599c30f73a9d7e9
    environment:
      SIM_RUNTIME: process # API-only startup mode, no container runtime
    ports:
      - "4566:4566"
      - "15353:5353/tcp"
      - "15353:5353/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4566/"]
      interval: 3s
      timeout: 3s
      retries: 20
