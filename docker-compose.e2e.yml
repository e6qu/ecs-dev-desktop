# SPDX-License-Identifier: AGPL-3.0-or-later
# Tier-2.5 e2e harness: the sockerless AWS sim in CONTAINER mode (it executes real
# task containers, unlike the process-mode Tier-2 sim) so we can prove the full
# workspace data-fidelity loop. Needs a container runtime: the Docker/podman
# socket mounted + --privileged. Consumed endpoint-only (AGENTS.md §6.8).
#
# The published sockerless-cloud simulators, pinned by digest to the release the
# shared dev environment runs (scripts/check-sim-pins.sh); the container-mode
# variant is the same image plus the netns toolchain (infra/sim).
#
# DynamoDB is served by the sim (the container-mode `sockerless-aws-exec` at :4566, same
# AWS surface as Tier-2); the standalone DynamoDB-Local container was retired from CI.

services:
  sockerless-aws-exec:
    # Named so it can be run prebuilt (`up --no-build`) from a pulled image — the
    # macOS CI job pulls this from GHCR instead of building it under colima (slow).
    # The Linux path still `up --build`s and tags it with this same name.
    image: edd-sim-aws-exec:e2e
    build:
      context: ./infra/sim
      dockerfile: sockerless-aws-exec.Dockerfile
      args:
        SOCKERLESS_AWS_IMAGE: ghcr.io/e6qu/sockerless-simulator-aws@sha256:407b230954ae528313ed1f9c089636c74cfc61c889b416845599c30f73a9d7e9
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4566/"]
      interval: 3s
      timeout: 3s
      retries: 30

  # bleephub: the sockerless GitHub server (mock-free auth e2e).
  bleephub:
    image: ghcr.io/e6qu/bleephub@sha256:b8930d312075e07a034f6f7a04783b2282c91d201f14d8e65e0728f3bdcffe8f
    environment:
      # Required since sockerless#501 / PR#506: bleephub log.Fatal on startup if unset.
      # Any non-PAT value; this is a test credential, not a real GitHub token.
      BLEEPHUB_ADMIN_TOKEN: edd-e2e-admin-token
      # Bring bleephub up "with the GitHub App already registered" (sockerless #564):
      # the seed file + key come from scripts/gen-sim-github-app.sh (run before
      # bring-up). The App e2e then uses only coordinates — never a sim-internal API.
      BLEEPHUB_SEED_APPS_FILE: /seed/seed.json
    volumes:
      - ./temp/github-app:/seed:ro
    ports:
      - "5555:5555"
    healthcheck:
      # The published image carries no HTTP client; the listener accepting a
      # connection is what "up" means for a server that binds only once it serves.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5555"]
      interval: 3s
      timeout: 3s
      retries: 20

  # azure-sim: the sockerless Azure/Entra simulator (mock-free Entra auth e2e).
  # Drives the standard surfaces only — Microsoft Graph user/group provisioning,
  # group membership, and the ROPC token grant — so the test is swappable with
  # real Entra by base-URL alone (AGENTS.md §6.8).
  azure-sim:
    image: ghcr.io/e6qu/sockerless-simulator-azure@sha256:6a6e7baad174bf24a6b05b3cbe29e56f3f8c1b34a092a2ca3dc3fb609f4ae882
    # API-only: the auth flow (Graph + OAuth) executes no workloads, so the sim
    # needs no container runtime — process mode (same as the Tier-2 harness).
    environment:
      SIM_RUNTIME: process
    ports:
      - "4568:4568"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:4568/common/v2.0/.well-known/openid-configuration",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
