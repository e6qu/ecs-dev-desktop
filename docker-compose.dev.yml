# Local DEVELOPMENT substrate for running the app (`pnpm dev`), tiered via compose
# profiles so you bring up only what you need (see docs/running-locally.md):
#
#   (none)            sockerless AWS sim (process mode) — serves DynamoDB at
#                     :4566. App runs with in-process fakes for compute/storage
#                     + dev-auth.
#   --profile github  + bleephub (the GitHub server) for the real OAuth login flow.
#   --profile entra   + the Azure/Entra sim for the real Entra OIDC login flow.
#
# To drive the real ECS/EBS adapters locally: COMPUTE_PROVIDER=ecs +
# AWS_ENDPOINT_URL=http://127.0.0.1:4566 (the default sim already serves these).
#
# Sims are the published sockerless-cloud images, pinned by digest to the
# release the shared dev environment runs (scripts/check-sim-pins.sh). Consumed
# endpoint-only (AGENTS.md §6.8/§6.9) — the app/tests differ from real cloud by
# coordinates alone. `pnpm dev` reaps any prior project stack first so a stale run
# never breaks the current one (see scripts/dev.sh).

services:
  # AWS API surface (EC2/EBS, ECS, DynamoDB, …) in process mode. Serves DynamoDB
  # on :4566 (the unified sim endpoint). DynamoDB Local was retired from the dev
  # loop — the sim's DynamoDB is conformant and serves on the same port as the
  # rest of the AWS API surface.
  sockerless-aws:
    image: ghcr.io/e6qu/sockerless-simulator-aws@sha256:6df3e4879c990fe8935c21636eaf1f29a09556196169dc55f383dc1af30bebbb
    environment:
      SIM_RUNTIME: process
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4566/"]
      interval: 3s
      timeout: 3s
      retries: 20

  # GitHub server (real OAuth web flow locally). Point the app at it with
  # AUTH_GITHUB_API_URL / AUTH_GITHUB_URL (see docs/running-locally.md).
  bleephub:
    profiles: ["github"]
    image: ghcr.io/e6qu/bleephub@sha256:b8930d312075e07a034f6f7a04783b2282c91d201f14d8e65e0728f3bdcffe8f
    environment:
      BLEEPHUB_ADMIN_TOKEN: edd-dev-admin-token
    ports:
      - "5555:5555"
    healthcheck:
      # The published image carries no HTTP client; the listener accepting a
      # connection is what "up" means for a server that binds only once it serves.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5555"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Azure/Entra OIDC + Graph (real Entra login flow locally).
  azure-sim:
    profiles: ["entra"]
    image: ghcr.io/e6qu/sockerless-simulator-azure@sha256:a70426f000480b5edc26db6d2b97e7d17d07bd97b28b54b4661c2adbac5f7d25
    environment:
      SIM_RUNTIME: process
    ports:
      - "4568:4568"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:4568/common/v2.0/.well-known/openid-configuration",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
