# SPDX-License-Identifier: AGPL-3.0-or-later
# Release pipeline: build and publish the platform's app images to GitHub
# Container Registry (ghcr.io). Triggered by every main merge. Authenticates with
# the workflow's GITHUB_TOKEN (packages: write) — no AWS, no ECR, no static keys.
#
# What it publishes (see scripts/publish-images.sh with EDD_BUILD_TARGET=web),
# grouped under ghcr.io/<owner>/edd/:
#   edd/control-plane:<tag>         Next.js app (also the reconciler image)
#   edd/control-plane:<tag>-amd64   amd64 image
#   edd/control-plane:<tag>-arm64   arm64 image
#   edd/ssh-gateway:<tag>           SSH gateway
#   edd/ssh-gateway:<tag>-amd64     amd64 image
#   edd/ssh-gateway:<tag>-arm64     arm64 image
# Workspace/golden image rebuilds are handled by the separate non-blocking
# golden-images workflow, not by this release workflow. The tag without the suffix
# is a manifest over the architectures built by this workflow; the suffixed tags
# are the per-arch images for runners (e.g. Lambda) that cannot consume manifests.
# Terraform remains the sole deployment owner. An operator pins the published
# immutable image coordinate in Infra, applies it, then explicitly dispatches the
# post-deployment smoke with that deployed source prefix.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency: release

jobs:
  # Per-arch build matrix on native runners (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) so
  # neither the control-plane nor ssh-gateway image is built under slow QEMU emulation. Each job
  # pushes only the per-arch tags (EDD_SKIP_MANIFEST); the `manifest` job combines them.
  publish:
    name: publish images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      TAG: ${{ github.sha }}
      EDD_BUILD_TARGET: web
      EDD_BUILD_ARCHS: ${{ matrix.arch }}
      EDD_BUILDX_CACHE: gha
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - uses: ./.github/actions/pnpm-install

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & push per-arch images
        env:
          EDD_BUILDX_OUTPUT: push
          EDD_SKIP_MANIFEST: "1"
        run: |
          sh scripts/publish-images.sh \
            "${{ github.repository_owner }}" \
            "${TAG:0:12}"

  # Combine the native per-architecture images into verified multi-architecture manifests.
  manifest:
    name: publish manifests
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.sha }}
      EDD_BUILD_TARGET: web
      EDD_BUILD_ARCHS: amd64 arm64
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create & push multi-arch manifests
        env:
          EDD_BUILDX_OUTPUT: push
          EDD_MANIFEST_ONLY: "1"
        run: |
          sh scripts/publish-images.sh \
            "${{ github.repository_owner }}" \
            "${TAG:0:12}"

      - name: Verify published OCI image shape
        run: |
          sh scripts/verify-published-images.sh \
            "${{ github.repository_owner }}" \
            "${TAG:0:12}" \
            control-plane ssh-gateway
