# SPDX-License-Identifier: AGPL-3.0-or-later
# Golden image collection.
#
# Pull requests validate the shared base + language variants without publishing.
# Main-branch pushes publish the configured golden variants to GitHub Container
# Registry (ghcr.io) with the workflow's GITHUB_TOKEN (packages: write) — no AWS,
# no ECR. This workflow is intentionally separate from `release`: a control-plane
# deploy must not wait for the expensive workspace image build, and a failed
# golden build can be rerun without rolling ECS services.
name: golden-images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "infra/images/**"
      - "packages/e2e/src/image-variants.e2e.ts"
      - ".github/workflows/golden-images.yml"

concurrency:
  group: golden-images-${{ github.ref }}
  # Queue main-branch builds instead of cancelling them: a cancelled publish
  # leaves the catalog waiting on a tag that never reaches the registry. PR refs
  # still cancel superseded validation runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # Pull-request validation builds the shared base once and each language variant in
  # its own job, the same split the publish jobs below use so every unit has its own
  # 15-minute cap. One job built the base and all five variants in sequence: a cold
  # base took 4.3 minutes and the variants never had a cache at all, so a branch's
  # first run -- ecs-dev-desktop #288 on 2026-09-15 -- was cancelled at 15 minutes
  # still compiling cargo-audit in the fifth variant.
  #
  # The cache scopes are the ones scripts/publish-images.sh uses on main for amd64
  # (image and architecture, no tag), and a pull request may restore its base
  # branch's caches, so a new branch starts from main's layers instead of cold.
  validate-base:
    name: validate golden base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIXTURE: ghcr.io/${{ github.repository_owner }}/edd-ci-golden-base
      BASE_CACHE_SCOPE: ghcr.io-${{ github.repository_owner }}-edd-edd-base-amd64
      NOT_A_RELEASE: "Ephemeral CI fixture for golden-image validation. NOT a release image -- do not pull or deploy; rebuilt from PR code every run."
    steps:
      - uses: actions/checkout@v6.0.2
      # build.sh stages the first-party Monaco editor (@edd/editor-monaco) into the
      # base context before it builds.
      - uses: ./.github/actions/pnpm-install
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The variants build FROM this exact run-scoped image in their own jobs, so it is
      # pushed rather than loaded into this runner's image store.
      - name: Build & push the golden base (CI fixture)
        run: |
          infra/images/base/build.sh "${FIXTURE}:ci-${{ github.run_id }}" --push \
            --cache-from "type=gha,scope=${BASE_CACHE_SCOPE}" \
            --cache-to "type=gha,mode=max,scope=${BASE_CACHE_SCOPE}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.description=${NOT_A_RELEASE}"
      - name: Retain only the newest 20 golden base fixture versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: edd-ci-golden-base
        run: sh scripts/retain-ghcr-package-versions.sh "$OWNER" "$PACKAGE_NAME" 20

  validate-variant:
    name: validate golden variant (${{ matrix.variant }})
    if: github.event_name == 'pull_request'
    needs: validate-base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [typescript, python, go, java, rust]
    env:
      FIXTURE: ghcr.io/${{ github.repository_owner }}/edd-ci-golden-base
      VARIANT_CACHE_SCOPE: ghcr.io-${{ github.repository_owner }}-edd-golden-${{ matrix.variant }}-amd64
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/pnpm-install
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # buildx pulls the base from the registry, so the variant build can use the GHA
      # cache; --load puts the result where the smoke test runs it.
      - name: Build the ${{ matrix.variant }} variant FROM the base fixture
        run: |
          docker buildx build --load \
            --build-arg "BASE=${FIXTURE}:ci-${{ github.run_id }}" \
            --cache-from "type=gha,scope=${VARIANT_CACHE_SCOPE}" \
            --cache-to "type=gha,mode=max,scope=${VARIANT_CACHE_SCOPE}" \
            -t "edd-ws-${{ matrix.variant }}:e2e" \
            "infra/images/${{ matrix.variant }}"
      # The toolchain present, the shared base behaviour intact, and slim -- for this
      # variant only. vitest is called directly: pnpm passes a `--` separator through,
      # and vitest then ignored the name filter and ran every variant.
      - name: ${{ matrix.variant }} variant smoke test
        run: pnpm --filter @edd/e2e exec vitest run --config vitest.images.config.ts -t "${{ matrix.variant }} variant"

  prepare:
    name: prepare golden publication
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_GOLDEN_VARIANTS: ${{ vars.RELEASE_GOLDEN_VARIANTS }}
    outputs:
      variants: ${{ steps.variants.outputs.json }}
    steps:
      - name: Validate golden variants
        id: variants
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_GOLDEN_VARIANTS" ]; then
            echo "::error::RELEASE_GOLDEN_VARIANTS is required for the golden-images workflow"
            exit 1
          fi
          for variant in $RELEASE_GOLDEN_VARIANTS; do
            if [[ ! "$variant" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::invalid golden image variant: $variant"
              exit 1
            fi
          done
          json=$(tr ' ' '\n' <<< "$RELEASE_GOLDEN_VARIANTS" | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$json" = "[]" ]; then
            echo "::error::RELEASE_GOLDEN_VARIANTS must contain at least one variant"
            exit 1
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"

  # Build the large shared base once per native architecture. Keeping base and
  # variants in separate jobs gives every publication unit a hard 15-minute cap.
  publish-base:
    name: publish golden base (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      TAG: ${{ github.sha }}
      EDD_BUILD_TARGET: golden
      EDD_BUILD_ARCHS: ${{ matrix.arch }}
      EDD_BUILDX_CACHE: gha
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - uses: ./.github/actions/pnpm-install

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push golden base image
        env:
          EDD_BUILDX_OUTPUT: push
          EDD_GOLDEN_MODE: base-only
          EDD_SKIP_MANIFEST: "1"
        run: |
          sh scripts/publish-images.sh \
            "${{ github.repository_owner }}" \
            "${TAG:0:12}"

  # Every variant consumes the immutable base tag and publishes independently.
  # A slow language toolchain cannot hold another architecture or variant hostage.
  publish:
    name: publish golden image (${{ matrix.variant }}, ${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: [prepare, publish-base]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      TAG: ${{ github.sha }}
      EDD_BUILD_TARGET: golden
      EDD_BUILD_ARCHS: ${{ matrix.arch }}
      EDD_BUILDX_CACHE: gha
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push golden variant image
        env:
          EDD_BUILDX_OUTPUT: push
          EDD_GOLDEN_MODE: variants-only
          EDD_SKIP_MANIFEST: "1"
        run: |
          sh scripts/publish-images.sh \
            "${{ github.repository_owner }}" \
            "${TAG:0:12}" \
            "${{ matrix.variant }}"

  # Combine the per-arch tags into the multi-arch `:<tag>` manifest ECS Fargate pulls. No build
  # here, so it needs neither a native runner nor Node — just Docker + registry login.
  manifest:
    name: publish golden multi-arch manifests
    if: github.event_name == 'push'
    needs: [prepare, publish-base, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_GOLDEN_VARIANTS: ${{ vars.RELEASE_GOLDEN_VARIANTS }}
      TAG: ${{ github.sha }}
      EDD_BUILD_TARGET: golden
      EDD_BUILD_ARCHS: amd64 arm64
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create & push multi-arch manifests
        env:
          EDD_BUILDX_OUTPUT: push
          EDD_MANIFEST_ONLY: "1"
        run: |
          read -r -a variants <<< "$RELEASE_GOLDEN_VARIANTS"
          sh scripts/publish-images.sh \
            "${{ github.repository_owner }}" \
            "${TAG:0:12}" \
            "${variants[@]}"

      - name: Verify pushed golden OCI image shape
        run: |
          set -euo pipefail
          read -r -a variants <<< "$RELEASE_GOLDEN_VARIANTS"
          repositories="edd-base"
          for variant in "${variants[@]}"; do
            repositories="$repositories golden/$variant"
          done
          # Repository coordinates are whitespace-delimited by contract.
          # shellcheck disable=SC2086
          sh scripts/verify-published-images.sh \
            "${{ github.repository_owner }}" \
            "${TAG:0:12}" \
            $repositories
